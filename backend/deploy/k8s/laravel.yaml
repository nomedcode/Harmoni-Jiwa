apiVersion: v1
kind: Namespace
metadata:
  name: klinik
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: klinik-api-config
  namespace: klinik
data:
  APP_ENV: production
  APP_DEBUG: "false"
  APP_URL: https://api.example.com
  FRONTEND_URL: https://app.example.com
  DB_CONNECTION: pgsql
  DB_HOST: postgres.database.svc.cluster.local
  DB_PORT: "5432"
  DB_DATABASE: klinik_personal
  DB_USERNAME: klinik_api
  LOG_CHANNEL: stderr
---
apiVersion: v1
kind: Secret
metadata:
  name: klinik-api-secrets
  namespace: klinik
type: Opaque
stringData:
  APP_KEY: replace-with-php-artisan-key-generate-output
  DB_PASSWORD: replace-with-postgres-password
  SUPABASE_JWT_SECRET: replace-with-supabase-jwt-secret
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: klinik-api
  namespace: klinik
spec:
  replicas: 2
  selector:
    matchLabels:
      app: klinik-api
  template:
    metadata:
      labels:
        app: klinik-api
    spec:
      containers:
        - name: api
          image: ghcr.io/replace-owner/klinik-doktor-personal-backend:latest
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: klinik-api-config
            - secretRef:
                name: klinik-api-secrets
          readinessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /up
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: klinik-api
  namespace: klinik
spec:
  selector:
    app: klinik-api
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
